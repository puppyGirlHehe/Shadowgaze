name: Build and Release

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Download Dalamud
        run: |
          wget https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -O /tmp/dalamud.zip
          mkdir -p $HOME/.xlcore/dalamud/Hooks/dev
          unzip /tmp/dalamud.zip -d $HOME/.xlcore/dalamud/Hooks/dev

      - name: Build
        run: dotnet build Shadowgaze.csproj --configuration Release

      - name: Find zip
        run: find . -name "*.zip" -not -path "*/obj/*"

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "bin/Release/Shadowgaze.zip"
          tag: latest
          commit: main
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
